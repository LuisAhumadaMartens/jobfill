<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Apply: Staff Engineer</title>
<style>
 body{font:15px/1.6 -apple-system,sans-serif;max-width:640px;margin:40px auto;padding:0 20px}
 .field{margin-bottom:18px} label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
 input,select,textarea{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font:inherit}
 .req{color:#c00} h1{font-size:20px} h2{font-size:14px;text-transform:uppercase;color:#666;margin-top:34px}
 button{background:#3b5;color:#fff;border:0;padding:10px 20px;border-radius:6px;font:inherit}
</style></head>
<body>
<h1>Staff Engineer Application</h1>
<form id="app" onsubmit="event.preventDefault();document.getElementById('done').hidden=false">

  <div class="field"><label for="first_name">First Name <span class="req">*</span></label>
    <input type="text" id="first_name" name="job_application[first_name]" autocomplete="given-name" required></div>

  <div class="field"><label for="last_name">Last Name <span class="req">*</span></label>
    <input type="text" id="last_name" name="job_application[last_name]" autocomplete="family-name" required></div>

  <div class="field"><label for="email">Email <span class="req">*</span></label>
    <input type="email" id="email" name="job_application[email]" autocomplete="email" required></div>

  <div class="field"><label for="phone">Phone</label>
    <input type="tel" id="phone" name="job_application[phone]" autocomplete="tel"></div>

  <div class="field"><label for="resume">Resume/CV <span class="req">*</span></label>
    <input type="file" id="resume" name="job_application[resume]" accept=".pdf,.doc,.docx"></div>

  <div class="field"><label for="ln">LinkedIn Profile</label>
    <input type="text" id="ln" name="job_application[answers_attributes][0][text_value]"></div>

  <div class="field"><label for="site">Website</label>
    <input type="text" id="site" name="job_application[answers_attributes][1][text_value]"></div>

  <h2>Additional information</h2>

  <div class="field"><label for="auth">Are you legally authorized to work in the United States? <span class="req">*</span></label>
    <select id="auth" name="q_auth" required>
      <option value="">Please select</option>
      <option>Yes</option><option>No</option>
    </select></div>

  <div class="field"><label for="spons">Will you now or in the future require sponsorship for employment visa status? <span class="req">*</span></label>
    <select id="spons" name="q_spons" required>
      <option value="">Please select</option>
      <option>Yes, I will require sponsorship</option>
      <option>No, I will not require sponsorship</option>
    </select></div>

  <div class="field"><label for="start">What is your earliest available start date?</label>
    <input type="text" id="start" name="q_start"></div>

  <div class="field"><label for="comp">What are your compensation expectations?</label>
    <input type="text" id="comp" name="q_comp"></div>

  <div class="field"><label for="why">Why do you want to work at Northwind?</label>
    <textarea id="why" name="q_why" rows="4"></textarea></div>

  <div class="field"><label for="heard">How did you hear about this job?</label>
    <input type="text" id="heard" name="q_heard"></div>

  <h2>U.S. Equal Employment Opportunity information</h2>

  <div class="field"><label for="gender">Gender</label>
    <select id="gender" name="gender">
      <option value="">Please select</option><option>Male</option><option>Female</option>
      <option>Decline To Self Identify</option>
    </select></div>

  <div class="field"><label for="race">Race / Ethnicity</label>
    <select id="race" name="race">
      <option value="">Please select</option>
      <option>Hispanic or Latino</option><option>White (Not Hispanic or Latino)</option>
      <option>Black or African American</option><option>Asian</option>
      <option>Decline To Self Identify</option>
    </select></div>

  <div class="field"><label for="vet">Veteran Status</label>
    <select id="vet" name="veteran">
      <option value="">Please select</option>
      <option>I am not a protected veteran</option>
      <option>I identify as one or more of the classifications of a protected veteran</option>
      <option>I don't wish to answer</option>
    </select></div>

  <div class="field"><label for="dis">Disability Status</label>
    <select id="dis" name="disability">
      <option value="">Please select</option>
      <option>Yes, I have a disability, or have had one in the past</option>
      <option>No, I do not have a disability</option>
      <option>I do not wish to answer</option>
    </select></div>

  <button type="submit">Submit application</button>
  <p id="done" hidden style="color:#3b5;font-weight:600">Submitted (not really, this is a fixture).</p>
</form>
</body></html>
