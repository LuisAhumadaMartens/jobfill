app = "jobfill-atlas"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ATLAS_DB = "/data/atlas.sqlite"
  ATLAS_THRESHOLD = "5"
  ATLAS_RATE = "30"

[mounts]
  source = "atlas_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
