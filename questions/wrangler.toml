name = "jobfill-questions"
main = "worker.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
QUESTIONS_THRESHOLD = "5"
QUESTIONS_RATE = "30"

[[d1_databases]]
binding = "DB"
database_name = "jobfill-questions"
database_id = "PENDING_RUN_WRANGLER_D1_CREATE"

[observability]
enabled = true
